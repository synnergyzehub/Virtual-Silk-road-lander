<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#1a365d" />
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#b3b7be" stroke-width="2" />
  
  <!-- Columns Representing Empire OS -->
  <rect x="50" y="60" width="20" height="80" fill="#b3b7be" />
  <rect x="90" y="60" width="20" height="80" fill="#b3b7be" />
  <rect x="130" y="60" width="20" height="80" fill="#b3b7be" />
  
  <!-- Top of the Building -->
  <polygon points="40,60 160,60 100,20" fill="#b3b7be" />
  
  <!-- Base of the Building -->
  <rect x="40" y="140" width="120" height="10" fill="#b3b7be" />
  
  <!-- Text -->
  <text x="100" y="175" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">EMPIRE OS</text>
</svg>